<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-box {
            width: 1000px;
            box-sizing: border-box;
            border: 3px solid black;
        }
        .first-blue-box {
            width: 100%;
            height: 100px;
            background-color: rgb(28, 28, 91);
            box-sizing: border-box;
        }
        .white-box {
            width: 150px;
            height: 50px;
            background-color: white;
            border: 1px solid black;
            margin: 25px;
        }
        .light-blue-box {
            width: 100px;
            height: 30px;
            background-color: rgb(151, 151, 230);
            border: 1px solid black;
            margin: 30px;
        }
        .middle-left-box {
            width: 250px;
            height: 606px;
            background-color: aqua;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .middle-left-item {
            width: 100%;
            flex: 1;             
            border-bottom: 1px solid black; 
            box-sizing: border-box;
        }
        .middle-left-item.last {
            flex: 1.3;
            border-bottom: none;
        }
        .middle-yellow-box {
            width: 750px;
            height: 300px;
            background-color: yellow;
            border: 1px solid black;
        }
        .middle-pink-box {
            width: 750px;
            height: 302px;
            background-color: pink;
            border: 1px solid black;
        }
        .deep-pink-box {
            width: 230px;
            height: 250px;
            background-color: rgb(138, 89, 98);
            margin: 25px auto;
            
            padding: auto;
        }
        .bottom-green-box {
            width: 100%;
            height: 100px;
            background-color: green;
            border: 1px solid black;

        }
        .flex1 {
            display: flex;
            justify-content: space-between;
        }
        .flex2 {
            display: flex;
            
        }
        .flex3 {
            display: flex;
        }
        .flex4 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }





    </style>
</head>

<body>
    <div class="main-box">
        <div class="first-blue-box">
            <div class="flex1">
                <div>
                    <div class="white-box"></div>
                </div>
                <div>  
                    <div class="flex2">
                        <div class="light-blue-box"></div>
                        <div class="light-blue-box"></div>
                        <div class="light-blue-box"></div>
                    </div>
                </div>    
            </div>    
        </div>
        <div class="middle-box">
            <div class="flex3">
                <div class="middle-left-box">
                    <div class="middle-left-item"></div>
                    <div class="middle-left-item"></div>
                    <div class="middle-left-item"></div>
                    <div class="middle-left-item"></div>
                    <div class="middle-left-item last"></div>
                </div>
                <div>
                    <div class="middle-yellow-box"></div>
                    <div class="middle-pink-box">
                        <div class="flex4">
                            <div class="deep-pink-box"></div>
                            <div class="deep-pink-box"></div>
                            <div class="deep-pink-box"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom-box">
            <div class="bottom-green-box"></div>
        </div>






    </div>
</body>
</html>
